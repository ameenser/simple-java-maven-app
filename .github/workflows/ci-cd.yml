name: CI/CD Java Docker

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  contents: write

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_USERNAME }}/simple-java-maven-app

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    if: github.event_name == 'workflow_dispatch' || !contains(github.event.head_commit.message, '[skip ci]')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install bump-my-version
        run: |
          python -m pip install --upgrade pip
          python -m pip install bump-my-version

      - name: Bump patch version
        run: |
          bump-my-version bump patch

      - name: Get new version
        run: |
          VERSION=$(bump-my-version show current_version)
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "New version: $VERSION"

      - name: Login to Docker Hub
        env:
          DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
        run: |
          echo "$DOCKERHUB_TOKEN" | docker login -u "$DOCKERHUB_USERNAME" --password-stdin

      - name: Build Docker image
        run: |
          docker build \
            -t $IMAGE_NAME:$VERSION \
            -t $IMAGE_NAME:latest \
            .

      - name: Push Docker image
        run: |
          docker push $IMAGE_NAME:$VERSION
          docker push $IMAGE_NAME:latest

      - name: Push version commit and tag
        run: |
          git push origin HEAD:${{ github.ref_name }} --follow-tags
